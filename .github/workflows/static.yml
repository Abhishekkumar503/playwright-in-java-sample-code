# ✅ FIXED: Publish Allure Reports with proper artifact naming and path configuration

name: Publish Allure Reports

on:
  # Triggers when test workflow completes
  workflow_run:
    workflows: ["Playwright Tests"]
    types:
      - completed
    branches:
      - main
  # Manual trigger for testing
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  download-artifacts:
    name: Download Test Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download artifacts from the triggering workflow run
      - name: Download artifacts from Playwright Tests
        id: download
        uses: dawidd6/action-download-artifact@v2
        with:
          # Get artifacts from the workflow that triggered this
          run_id: ${{ github.event.workflow_run.id }}
          name: test-reports
          path: ./artifacts
        continue-on-error: true

      - name: List downloaded artifacts
        run: |
          echo "📦 Downloaded artifacts:"
          find ./artifacts -type f 2>/dev/null | head -20 || echo "No artifacts found"
          echo ""
          echo "Directory structure:"
          find ./artifacts -type d 2>/dev/null | head -20 || echo "No directories found"

      # ✅ CRITICAL FIX: Consistent artifact naming
      - name: Re-upload Allure Results with consistent name
        uses: actions/upload-artifact@v4
        with:
          name: allure-results  # ✅ Use consistent name
          path: ./artifacts
          if-no-files-found: warn
        continue-on-error: true

  build-allure-report:
    name: Build Allure Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: download-artifacts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ✅ CRITICAL FIX: Download with matching artifact name
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: allure-results  # ✅ Must match the name from previous job
          path: ./artifacts

      - name: Check for Allure Results
        id: find-report
        run: |
          echo "📂 Checking artifacts directory:"
          find ./artifacts -type f | head -20
          
          # Look for allure-results directory or json files
          if find ./artifacts -name "*.json" -o -name "allure-results" | grep -q .; then
            echo "✅ Found allure test results"
            echo "has-results=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No allure results found"
            echo "has-results=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.find-report.outputs.has-results == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Allure CLI
        if: steps.find-report.outputs.has-results == 'true'
        run: |
          npm install -g allure-commandline

      # ✅ Handle different artifact structures
      - name: Prepare Allure Results Directory
        if: steps.find-report.outputs.has-results == 'true'
        run: |
          # If artifacts contains target/allure-results, use that
          if [ -d "./artifacts/target/allure-results" ]; then
            cp -r ./artifacts/target/allure-results ./allure-results
          # Otherwise use artifacts directly if it contains json files
          elif find ./artifacts -name "*.json" | grep -q .; then
            mkdir -p ./allure-results
            cp ./artifacts/*.json ./allure-results/ 2>/dev/null || true
            cp ./artifacts/*.txt ./allure-results/ 2>/dev/null || true
          else
            echo "❌ Cannot find allure results in expected locations"
            exit 1
          fi
          
          echo "✅ Allure results prepared:"
          ls -la ./allure-results/

      - name: Generate Allure Report
        if: steps.find-report.outputs.has-results == 'true'
        run: |
          allure generate allure-results --clean -o allure-report
          echo "✅ Allure report generated successfully"

      - name: Verify Report Generation
        if: steps.find-report.outputs.has-results == 'true'
        run: |
          if [ -f "allure-report/index.html" ]; then
            echo "✅ Report file exists"
            ls -lah allure-report/ | head -20
          else
            echo "❌ Report not generated"
            ls -lah allure-report/ || echo "Directory not found"
            exit 1
          fi

      # ✅ Upload to GitHub Pages artifact
      - name: Upload Artifact to GitHub Pages
        if: steps.find-report.outputs.has-results == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'allure-report'

  deploy-to-allure-report-branch:
    name: Deploy to Allure-Report Branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-allure-report
    if: needs.build-allure-report.result == 'success'

    steps:
      - name: Checkout Allure-Report branch
        uses: actions/checkout@v4
        with:
          ref: Allure-Report
          fetch-depth: 0
        continue-on-error: true

      - name: Download Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./report

      - name: Extract artifact
        run: |
          cd report
          tar -xf artifact.tar
          cd ..
          echo "✅ Artifact extracted"
          ls -lah report/

      - name: Configure Git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Update Allure-Report branch
        run: |
          # Remove old files except .git and .gitignore
          find . -maxdepth 1 ! -name '.git' ! -name '.gitignore' ! -name '.' -delete
          
          # Copy new report
          cp -r report/* .
          
          # Add and commit
          git add -A
          git commit -m "Update Allure Report - $(date '+%Y-%m-%d %H:%M:%S') - Run #${{ github.run_number }}" || echo "No changes to commit"
          
          # Push to Allure-Report branch
          git push origin Allure-Report

      - name: Report Deployment Summary
        if: always()
        run: |
          echo "### 📊 Allure Report Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "✅ Report deployed to Allure-Report branch!" >> $GITHUB_STEP_SUMMARY
          echo "📍 GitHub Pages URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY

  deploy-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-allure-report
    if: needs.build-allure-report.result == 'success'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4