name: Playwright Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # Increased a bit for safety

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java Setup (use consistent version)
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'          # Changed to 17 - more stable for Playwright + Serenity
          cache: 'maven'

      # Maven Setup (you can keep or remove the extra setup-maven if not needed)
      - name: Setup Maven
        uses: s4u/setup-maven-action@v1.7.0
        with:
          maven-version: 3.9.9

      - name: Verify Maven
        run: mvn --version

      # Cache Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # Important: Build project first (downloads dependencies)
      - name: Build project
        run: mvn clean compile -B -DskipTests --no-transfer-progress

      # Install Playwright Browsers + OS dependencies (Java way - this is the fix)
      - name: Install Playwright Browsers
        run: |
          mvn exec:java -e \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps"

      # Run your Serenity/Playwright tests
      - name: Run Playwright Tests
        run: mvn verify -B --no-transfer-progress
        env:
          CI: true

      # Upload reports even if tests fail (very useful for debugging)
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-allure-report
          path: |
            target/site/serenity/
            target/allure-results/
            target/surefire-reports/
          retention-days: 7
