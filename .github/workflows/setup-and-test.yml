name: Common Setup

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      timeout:
        required: false
        type: number
        default: 90

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}

    steps:
      # ✅ Checkout FIRST (before setup, for faster setup)
      - name: Checkout branch ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          clean: true

      # ✅ Set up JDK 21 (consistent with other workflows)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ✅ Verify Maven installation
      - name: Verify Maven version
        run: mvn --version

      # ✅ Node.js setup (for Playwright CLI)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # ✅ Proper Playwright browser installation (CRITICAL)
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit firefox
        timeout-minutes: 10

      # ✅ Cache Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ✅ Build project (parallel, skip tests)
      - name: Build project
        run: mvn clean compile -B -DskipTests --no-transfer-progress -T 1C
        timeout-minutes: 20

      # ✅ Show project structure with context
      - name: Show Project Structure
        run: |
          echo "## Project Structure for branch: ${{ inputs.branch }}" | tee -a $GITHUB_STEP_SUMMARY
          echo "Java Files:" >> $GITHUB_STEP_SUMMARY
          find . -name "*.java" -type f | head -20 >> $GITHUB_STEP_SUMMARY || echo "No Java files found"

      # ✅ Run GitAction tests with proper timeouts
      - name: Run GitAction Tests
        run: |
          echo "🧪 Running GitAction tests for branch: ${{ inputs.branch }}"
          mvn verify \
            -Dtest=com.serenitydojo.playwright.GitAction.GitActionPageObject \
            -B \
            --no-transfer-progress \
            -T 1C \
            -Dplaywright.timeout=60000
        env:
          CI: true
          PLAYWRIGHT_TIMEOUT: 60000
          BROWSER_TIMEOUT: 60000
        timeout-minutes: 60
        continue-on-error: true  # ✅ CRITICAL: Continue even if tests fail

      # ✅ CRITICAL FIX: Create allure-results directory
      - name: Create Allure Results Directory
        if: always()
        run: |
          mkdir -p allure-results
          mkdir -p target/allure-results
          
          # Check what test result files were generated
          echo "📂 Looking for test results..."
          find target -name "*.json" -o -name "*.xml" 2>/dev/null | head -20 || echo "No test result files found"
          
          # Copy any allure results from target to root allure-results
          if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results)" ]; then
            cp -r target/allure-results/* allure-results/ 2>/dev/null || true
            echo "✅ Copied allure results from target/"
          fi
          
          # List what's in allure-results
          echo "📊 Allure results directory:"
          ls -la allure-results/ || echo "Empty"

      # ✅ CRITICAL: Upload test-reports artifact (needed by Publish workflow)
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports  # ✅ CRITICAL: This MUST be exactly "test-reports"
          path: |
            allure-results/
            target/site/serenity/
            target/surefire-reports/
          retention-days: 30  # ✅ Extended retention
          if-no-files-found: warn

      # ✅ NEW: Debug artifact upload
      - name: Verify Artifact Upload
        if: always()
        run: |
          echo "### Artifact Upload Verification 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "allure-results" ]; then
            FILE_COUNT=$(find allure-results -type f | wc -l)
            echo "✅ allure-results: $FILE_COUNT files" >> $GITHUB_STEP_SUMMARY
            find allure-results -type f | head -10 >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ allure-results directory not found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "target/serenity" ]; then
            FILE_COUNT=$(find target/serenity -type f 2>/dev/null | wc -l)
            echo "✅ target/serenity: $FILE_COUNT files" >> $GITHUB_STEP_SUMMARY
          fi

      # ✅ NEW: Test failure summary
      - name: Test Summary
        if: always()
        run: |
          if [ -d target/surefire-reports ]; then
            echo "### Tests for ${{ inputs.branch }} 📊" >> $GITHUB_STEP_SUMMARY
            TEST_COUNT=$(find target/surefire-reports -name "*.xml" | wc -l)
            echo "Test files: $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
          fi