name: Common Setup

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      timeout:
        required: false
        type: number
        default: 90

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}  # ✅ Use input timeout

    steps:
      # ✅ IMPROVED: Checkout FIRST (before setup, for faster setup)
      - name: Checkout branch ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          clean: true

      # ✅ IMPROVED: Set up JDK 21 (consistent with other workflows)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'  # ✅ FIXED: Removed conflicting JDK 17
          cache: 'maven'

#      # ✅ IMPROVED: Setup Maven (removed conflicting java-version)
#      - name: Setup Maven Action
#        uses: s4u/setup-maven-action@v1.7.0
#        with:
#          maven-version: 3.9.9
#          java-version: '21'


      # ✅ Verify Maven installation
      - name: Verify Maven version
        run: mvn --version

      # ✅ IMPROVED: Node.js with caching (was missing!)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'  # ✅ NEW: Cache npm dependencies

      # ✅ IMPROVED: Proper Playwright browser installation (CRITICAL FIX)
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit firefox
        timeout-minutes: 10

      # ✅ IMPROVED: Install Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ✅ IMPROVED: Build project (parallel, skip tests)
      - name: Build project
        run: mvn clean compile -B -DskipTests --no-transfer-progress -T 1C
        timeout-minutes: 20

      # ✅ IMPROVED: Show project structure with context
      - name: Show Project Structure
        run: |
          echo "## Project Structure for branch: ${{ inputs.branch }}" | tee -a $GITHUB_STEP_SUMMARY
          echo "Java Files:" >> $GITHUB_STEP_SUMMARY
          find . -name "*.java" -type f | head -20 >> $GITHUB_STEP_SUMMARY || echo "No Java files found"

      # ✅ IMPROVED: Run GitAction tests with proper timeouts
      - name: Run GitAction Tests
        run: |
          echo "🧪 Running GitAction tests for branch: ${{ inputs.branch }}"
          mvn verify \
            -Dtest=com.serenitydojo.playwright.GitAction.GitActionPageObject \
            -B \
            --no-transfer-progress \
            -T 1C \
            -Dplaywright.timeout=60000
        env:
          CI: true
          # ✅ ADDED: Timeout configuration for CI
          PLAYWRIGHT_TIMEOUT: 60000
          BROWSER_TIMEOUT: 60000
        timeout-minutes: 60

      # ✅ IMPROVED: Upload test reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ inputs.branch }}-${{ github.run_id }}
          path: |
            target/site/serenity/
            target/allure-results/
            target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

      # ✅ NEW: Test failure summary
      - name: Test Summary
        if: always()
        run: |
          if [ -d target/surefire-reports ]; then
            echo "### Tests for ${{ inputs.branch }} 📊" >> $GITHUB_STEP_SUMMARY
            find target/surefire-reports -name "*.xml" | wc -l | xargs echo "Test files:" >> $GITHUB_STEP_SUMMARY
          fi