name: Nightly Builds

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  build-main:
    name: Main
    timeout-minutes: 60
    uses: ./.github/workflows/setup-and-test.yml
    with:
      branch: main
      timeout : 30