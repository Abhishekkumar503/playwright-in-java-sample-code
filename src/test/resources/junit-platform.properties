# Enable parallel execution true/false
junit.jupiter.execution.parallel.enabled=true

# testA and testB can run at the same time
junit.jupiter.execution.parallel.mode.default=concurrent

# Without this, classes run sequentially even if methods are parallel.
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# JUnit automatically decides thread count based on CPU cores.
junit.jupiter.execution.parallel.config.strategy=dynamic

# Multiplies available CPU cores to determine thread pool size.
junit.jupiter.execution.parallel.config.dynamic.factor=4

# Enables detailed console logging for parallel test execution in JUnit 5
junit.jupiter.execution.parallel.console.mode = verbose